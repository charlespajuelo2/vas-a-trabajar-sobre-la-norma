    <line x1="127" y1="130" x2="127" y2="92" class="thin"/>
    <line x1="105" y1="92" x2="127" y2="92" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="135" y1="78" x2="345" y2="78" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="135" y1="88" x2="135" y2="124" class="thin"/>
    <line x1="345" y1="88" x2="345" y2="124" class="thin"/>
