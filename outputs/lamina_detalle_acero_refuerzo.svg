    <text x="24" y="38" class="title">GANCHO 180°</text>
    <path d="M90 260 L90 175 A65 65 0 0 1 220 175 L220 245" class="bar"/>
    <path d="M90 175 A65 65 0 0 1 220 175" class="ink"/>
    <path d="M107 175 A48 48 0 0 1 203 175" class="thin"/>
    <text x="154" y="105" text-anchor="middle" class="txt">D</text>
    <line x1="90" y1="175" x2="90" y2="90" class="thin"/>
    <line x1="220" y1="175" x2="220" y2="90" class="thin"/>
    <line x1="90" y1="90" x2="220" y2="90" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
