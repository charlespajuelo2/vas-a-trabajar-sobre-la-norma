    <rect x="52" y="94" width="376" height="205" fill="url(#aggregate)" stroke="#111" stroke-width="2"/>
    <line x1="74" y1="158" x2="358" y2="158" class="bar"/>
    <line x1="168" y1="235" x2="410" y2="235" class="bar"/>
    <g class="rib">
      <line x1="130" y1="153" x2="130" y2="163"/><line x1="150" y1="153" x2="150" y2="163"/><line x1="170" y1="153" x2="170" y2="163"/><line x1="190" y1="153" x2="190" y2="163"/><line x1="210" y1="153" x2="210" y2="163"/><line x1="230" y1="153" x2="230" y2="163"/><line x1="250" y1="153" x2="250" y2="163"/><line x1="270" y1="153" x2="270" y2="163"/><line x1="290" y1="153" x2="290" y2="163"/>
      <line x1="220" y1="230" x2="220" y2="240"/><line x1="240" y1="230" x2="240" y2="240"/><line x1="260" y1="230" x2="260" y2="240"/><line x1="280" y1="230" x2="280" y2="240"/><line x1="300" y1="230" x2="300" y2="240"/><line x1="320" y1="230" x2="320" y2="240"/><line x1="340" y1="230" x2="340" y2="240"/><line x1="360" y1="230" x2="360" y2="240"/>
    </g>
    <line x1="168" y1="320" x2="358" y2="320" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="168" y1="304" x2="168" y2="333" class="thin"/><line x1="358" y1="304" x2="358" y2="333" class="thin"/>
    <text x="263" y="355" text-anchor="middle" class="txt">lt</text>
  </g>

  <!-- Longitud de desarrollo -->
  <g transform="translate(1065 530)">
    <rect width="480" height="385" class="panel"/>
    <text x="24" y="38" class="title">LONGITUD DE DESARROLLO</text>
    <rect x="58" y="86" width="365" height="225" fill="url(#aggregate)" stroke="#111" stroke-width="2"/>
    <line x1="100" y1="200" x2="367" y2="200" class="bar"/>
    <g class="rib">
      <line x1="150" y1="195" x2="150" y2="205"/><line x1="170" y1="195" x2="170" y2="205"/><line x1="190" y1="195" x2="190" y2="205"/><line x1="210" y1="195" x2="210" y2="205"/><line x1="230" y1="195" x2="230" y2="205"/><line x1="250" y1="195" x2="250" y2="205"/><line x1="270" y1="195" x2="270" y2="205"/>
    </g>
    <line x1="100" y1="136" x2="367" y2="136" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="100" y1="148" x2="100" y2="192" class="thin"/><line x1="367" y1="148" x2="367" y2="192" class="thin"/>
    <text x="233" y="116" text-anchor="middle" class="txt">ld</text>
    <line x1="80" y1="200" x2="80" y2="310" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="72" y="260" text-anchor="middle" class="small" transform="rotate(-90 72 260)">anclaje</text>
  </g>

  <line x1="55" y1="940" x2="1545" y2="940" class="thin"/>
  <text x="800" y="962" text-anchor="middle" class="small">ESQUEMA EDUCATIVO — SÍMBOLOS: db · D · extensión del gancho · lt · ld</text>
</svg>
