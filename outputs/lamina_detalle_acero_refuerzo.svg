    <line x1="220" y1="245" x2="365" y2="245" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="220" y1="232" x2="220" y2="258" class="thin"/>
    <line x1="365" y1="232" x2="365" y2="258" class="thin"/>
    <text x="293" y="279" text-anchor="middle" class="txt">extensión del gancho</text>
  </g>

