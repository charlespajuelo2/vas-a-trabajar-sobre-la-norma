    <line x1="105" y1="91" x2="130" y2="91" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="145" y1="105" x2="326" y2="188" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="278" y="145" text-anchor="middle" class="txt" transform="rotate(24 278 145)">extensión del gancho</text>
  </g>

  <!-- Gancho 180 -->
  <g transform="translate(55 530)">
