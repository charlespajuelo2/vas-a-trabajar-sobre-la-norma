<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <pattern id="aggregate" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="7" r="1.4" fill="#111"/>
      <circle cx="17" cy="13" r="1.1" fill="#111"/>
      <circle cx="9" cy="23" r="1.2" fill="#111"/>
      <circle cx="24" cy="4" r="1" fill="#111"/>
    </pattern>
    <style>
      .ink{stroke:#111;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#111;fill:none;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
      .bar{stroke:#111;fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      .rib{stroke:#111;fill:none;stroke-width:1.2;stroke-linecap:round}
      .txt{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:20px;letter-spacing:.4px}
      .small{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:17px;letter-spacing:.25px}
      .title{font-family:Arial,Helvetica,sans-serif;fill:#111;font-size:25px;font-weight:700;letter-spacing:.8px}
      .panel{stroke:#111;fill:#fff;stroke-width:1.5}
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#fff"/>
  <rect x="28" y="28" width="1544" height="944" class="ink"/>
  <text x="800" y="68" text-anchor="middle" class="title">DETALLE ESTRUCTURAL — ACERO DE REFUERZO EN CONCRETO ARMADO</text>
  <line x1="55" y1="92" x2="1545" y2="92" class="thin"/>

  <!-- Barra recta -->
  <g transform="translate(55 115)">
    <rect width="480" height="385" class="panel"/>
    <text x="24" y="38" class="title">BARRA RECTA</text>
    <line x1="65" y1="188" x2="415" y2="188" class="bar"/>
    <g transform="translate(230 188)">
      <line x1="0" y1="-4" x2="0" y2="4" class="rib"/>
      <line x1="18" y1="-4" x2="18" y2="4" class="rib"/>
      <line x1="36" y1="-4" x2="36" y2="4" class="rib"/>
      <line x1="54" y1="-4" x2="54" y2="4" class="rib"/>
      <line x1="72" y1="-4" x2="72" y2="4" class="rib"/>
    </g>
    <line x1="236" y1="178" x2="236" y2="198" class="thin"/>
    <line x1="246" y1="178" x2="246" y2="198" class="thin"/>
    <line x1="236" y1="178" x2="246" y2="178" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="241" y="160" text-anchor="middle" class="txt">db</text>
    <line x1="65" y1="245" x2="415" y2="245" class="thin" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="65" y1="232" x2="65" y2="258" class="thin"/>
    <line x1="415" y1="232" x2="415" y2="258" class="thin"/>
    <text x="240" y="279" text-anchor="middle" class="small">diámetro nominal: db</text>
  </g>

  <!-- Gancho 90 -->
  <g transform="translate(560 115)">
    <rect width="480" height="385" class="panel"/>
    <text x="24" y="38" class="title">GANCHO 90°</text>
    <path d="M105 270 L105 160 Q105 130 135 130 L345 130" class="bar"/>
